<!-- =============== index.html (HOME) ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Audrey&family=Cursive:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Caveat,sans-serif;
  background:linear-gradient(200deg,#ffd1dc,#ffe6f0);
  overflow:hidden;
}

.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:white;
  padding:50px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.2);
  animation:fadeIn 2s ease;
}

h1{
  font-family:Pacifico,cursive;
  color:#ff4d6d;
  font-size:3.2rem;
}

p{ font-size:1.1rem; }

nav a{
  display:inline-block;
  margin:12px;
  background:#ff4d6d;
  color:white;
  text-decoration:none;
  padding:14px 28px;
  border-radius:40px;
  transition:.3s;
}

nav a:hover{ transform:scale(1.08); }

.heart{
  position:absolute;
  color:#ff4d6d;
  animation:float 6s infinite;
}

.music-hint{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  color:#ff4d6d;
  font-size:1rem;
  opacity:0.9;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;}
}

@media (max-width: 600px) {
  .card {
    width: 90%;
    padding: 30px 20px;
  }

  h1 {
    font-size: 2.2rem;
  }

  nav a {
    display: block;
    margin: 10px auto;
    width: 80%;
  }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card">
    <h1>Happy Birthday My Love</h1>
    <p>To the most special man in my life 💕</p>
    <nav>
      <a href="letter.html">My Letter 💌</a>
      <a href="memories.html">Our Memories 📸</a>
      <a href="reasons.html">Why I Love You ❤️</a>
      <a href="wish.html">Birthday Wish 🎂</a>
    </nav>
  </div>
</div>

<div class="music-hint">Tap anywhere to play music 🎵</div>

<script>
// Floating hearts
for(let i=0;i<20;i++){
  let h=document.createElement('div');
  h.className='heart';
  h.innerHTML='❤️';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(20+Math.random()*30)+'px';
  h.style.animationDuration=(4+Math.random()*4)+'s';
  document.body.appendChild(h);
}

// Music on first click
document.addEventListener('click', function(){
  const music = document.getElementById('bgMusic');
  music.play();
  document.querySelector('.music-hint').style.display = 'none';
}, { once:true });
</script>

</body>
</html>
