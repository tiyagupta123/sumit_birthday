<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Memories 📸</title>
<style>
body{ font-family:Poppins; background:#fffaf0; padding:40px; }
h1{ color:#ff4d6d; text-align:center; }
.grid{
display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px;
}
.photo{
background:#ffd1dc; height:220px; border-radius:20px;
display:flex; align-items:center; justify-content:center;
font-size:1.2rem; animation:pulse 2s infinite;
}
@keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
a{ display:block; margin-top:30px; color:#ff4d6d; text-align:center; }
</style>
</head>
<body>
<h1>Our Beautiful Memories 💕</h1>
<div class="grid">
<div class="photo">Our First Pic</div>
<div class="photo">Favourite Moment</div>
<div class="photo">Best Day Ever</div>
<div class="photo">Forever Us</div>
</div>
<a href="index.html">← Back Home</a>
</body>
</html>
