<!-- ================= memories.html ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Memories 📸</title>

<style>
body{
  font-family: Poppins, sans-serif;
  background:#fffaf0;
  padding:40px;
}

h1{
  color:#ff4d6d;
  text-align:center;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:20px;
}

.photo{
  background:#ffd1dc;
  height:320px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  animation:pulse 2s infinite;
}

/* Image styling */
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:20px;
}

/* Cute caption */
.photo span{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.45);
  color:white;
  padding:6px 14px;
  border-radius:14px;
  font-size:0.95rem;
}

.photo video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:20px;
}

.grid:first-of-type {
  max-width: 480px;
  margin: 0 auto 10px auto;
}

.photo img{
  filter: brightness(1.25) contrast(1.05);
}


/* Animation */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(0.8);}
}

a{
  display:block;
  margin-top:40px;
  color:#ff4d6d;
  text-align:center;
  font-size:1.1rem;
  text-decoration:none;
}
a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<h1>Our Beautiful Memories 💕</h1>

<div class="grid" style="margin-bottom:10px;">
  <div class="photo">
    <img src="you.jpeg" alt="Extra Memory 1">
    <span>You 💖</span>
  </div>

 <div class="photo">
  <video autoplay loop muted playsinline>
    <source src="me.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
    <span>Me 💕</span>
  </div>
</div>

<div class="grid">

  <div class="photo">
    <img src="photo1.jpeg" alt="Our First Pic">
    <span>Our First Pic 💞</span>
  </div>

<div class="photo">
  <video autoplay loop muted playsinline>
    <source src="photo2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <span>Favourite Moment ✨</span>
</div>

  <div class="photo">
    <img src="photo3.jpeg" alt="Best Day Ever">
    <span>Best Day Ever 🥰</span>
  </div>

  <div class="photo">
    <img src="photo4.jpeg" alt="Forever Us">
    <span>Forever Us ❤️</span>
  </div>

</div>

<a href="index.html">← Back Home</a>

</body>
</html>
